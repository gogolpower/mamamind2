name: mamamind
description: MamaMind MVP — умный дневник малыша с ИИ-советником
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: ^0.19.0
  collection: ^1.18.0

  # Медиа
  image_picker: ^1.1.2

  # HTTP (если решим ходить в облако)
  http: ^1.2.2

  # Локальные пути/файлы
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
